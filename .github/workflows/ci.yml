name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore MobilityFinance.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format MobilityFinance.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MobilityFinance.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test MobilityFinance.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            project: src/Web/MobilityFinance.Web/MobilityFinance.Web.csproj
            dll: MobilityFinance.Web.dll
          - name: origination-api
            project: src/Services/Origination/MobilityFinance.Origination.Api/MobilityFinance.Origination.Api.csproj
            dll: MobilityFinance.Origination.Api.dll
          - name: ledger-api
            project: src/Services/Ledger/MobilityFinance.Ledger.Api/MobilityFinance.Ledger.Api.csproj
            dll: MobilityFinance.Ledger.Api.dll
          - name: assets-api
            project: src/Services/Assets/MobilityFinance.Assets.Api/MobilityFinance.Assets.Api.csproj
            dll: MobilityFinance.Assets.Api.dll
          - name: operations-api
            project: src/Services/Operations/MobilityFinance.Operations.Api/MobilityFinance.Operations.Api.csproj
            dll: MobilityFinance.Operations.Api.dll
          - name: activation-worker
            project: src/Workers/Activation/MobilityFinance.Activation.Worker/MobilityFinance.Activation.Worker.csproj
            dll: MobilityFinance.Activation.Worker.dll
          - name: projections-worker
            project: src/Workers/Projections/MobilityFinance.Projections.Worker/MobilityFinance.Projections.Worker.csproj
            dll: MobilityFinance.Projections.Worker.dll
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: mobility-finance-${{ matrix.name }}:${{ github.sha }}
          build-args: |
            PROJECT_PATH=${{ matrix.project }}
            APP_DLL=${{ matrix.dll }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
