name: Infrastructure validation

on:
  push:
    branches:
      - main
    paths:
      - deploy/**
      - .github/workflows/infrastructure.yml
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/infrastructure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Lint chart
        run: >-
          helm lint deploy/helm/mobility-finance
          --set serviceBus.fullyQualifiedNamespace=validation.servicebus.windows.net

      - name: Render chart
        run: >-
          helm template mobility deploy/helm/mobility-finance
          --namespace mobility-finance
          --set serviceBus.fullyQualifiedNamespace=validation.servicebus.windows.net
          --set serviceAccount.workloadIdentity.enabled=true
          --set serviceAccount.workloadIdentity.clientId=00000000-0000-0000-0000-000000000001
          --set serviceAccount.workloadIdentity.tenantId=00000000-0000-0000-0000-000000000002
          > rendered.yaml

      - name: Validate Kubernetes resources
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0-alpine
        with:
          args: -strict -summary rendered.yaml

  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Compile Bicep
        uses: azure/cli@v2
        with:
          azcliversion: 2.78.0
          inlineScript: |
            az bicep build --file deploy/azure/main.bicep --stdout >/dev/null
            az bicep build-params \
              --file deploy/azure/environments/dev.bicepparam \
              --stdout >/dev/null
