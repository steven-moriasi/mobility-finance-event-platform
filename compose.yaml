name: mobility-finance

x-app: &app
  restart: unless-stopped
  environment:
    ASPNETCORE_ENVIRONMENT: Development

services:
  servicebus-database:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local-ServiceBus-Password-2026!"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    volumes:
      - ./deploy/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-database
      MSSQL_SA_PASSWORD: "Local-ServiceBus-Password-2026!"
      EMULATOR_HTTP_PORT: "5300"
      SQL_WAIT_INTERVAL: "15"
    depends_on:
      - servicebus-database

  web:
    <<: *app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ServiceEndpoints__Origination: http://origination-api:8080
      ServiceEndpoints__Ledger: http://ledger-api:8080
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT_PATH: src/Web/MobilityFinance.Web/MobilityFinance.Web.csproj
        APP_DLL: MobilityFinance.Web.dll
    ports:
      - "8080:8080"

  origination-api:
    <<: *app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ServiceBus__ConnectionString: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__EventsTopic: mobility-events
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT_PATH: src/Services/Origination/MobilityFinance.Origination.Api/MobilityFinance.Origination.Api.csproj
        APP_DLL: MobilityFinance.Origination.Api.dll
    depends_on:
      - servicebus-emulator

  ledger-api:
    <<: *app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ServiceBus__ConnectionString: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__EventsTopic: mobility-events
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT_PATH: src/Services/Ledger/MobilityFinance.Ledger.Api/MobilityFinance.Ledger.Api.csproj
        APP_DLL: MobilityFinance.Ledger.Api.dll
    depends_on:
      - servicebus-emulator

  assets-api:
    <<: *app
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT_PATH: src/Services/Assets/MobilityFinance.Assets.Api/MobilityFinance.Assets.Api.csproj
        APP_DLL: MobilityFinance.Assets.Api.dll

  operations-api:
    <<: *app
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT_PATH: src/Services/Operations/MobilityFinance.Operations.Api/MobilityFinance.Operations.Api.csproj
        APP_DLL: MobilityFinance.Operations.Api.dll

  activation-worker:
    <<: *app
    environment:
      DOTNET_ENVIRONMENT: Development
      ServiceBus__ConnectionString: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__EventsTopic: mobility-events
      ServiceBus__Subscription: activation-workflows
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT_PATH: src/Workers/Activation/MobilityFinance.Activation.Worker/MobilityFinance.Activation.Worker.csproj
        APP_DLL: MobilityFinance.Activation.Worker.dll
    depends_on:
      - servicebus-emulator

  projections-worker:
    <<: *app
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT_PATH: src/Workers/Projections/MobilityFinance.Projections.Worker/MobilityFinance.Projections.Worker.csproj
        APP_DLL: MobilityFinance.Projections.Worker.dll
