{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mobility-finance.fullname" $ }}-{{ $name }}
  labels:
    {{- include "mobility-finance.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not (and $component.autoscaling $component.autoscaling.enabled) }}
  replicas: {{ $component.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "mobility-finance.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "mobility-finance.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        app.kubernetes.io/part-of: mobility-finance
        {{- if $.Values.serviceAccount.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "mobility-finance.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.workloadIdentity.enabled }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $component.image }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            {{- if eq $name "web" }}
            - name: ServiceEndpoints__Origination
              value: http://{{ include "mobility-finance.fullname" $ }}-origination-api:8080
            - name: ServiceEndpoints__Ledger
              value: http://{{ include "mobility-finance.fullname" $ }}-ledger-api:8080
            - name: ServiceEndpoints__Assets
              value: http://{{ include "mobility-finance.fullname" $ }}-assets-api:8080
            {{- end }}
            {{- if $component.serviceBus }}
            - name: ServiceBus__FullyQualifiedNamespace
              value: {{ required "serviceBus.fullyQualifiedNamespace is required by messaging components" $.Values.serviceBus.fullyQualifiedNamespace | quote }}
            - name: ServiceBus__EventsTopic
              value: {{ $.Values.serviceBus.eventsTopic | quote }}
            {{- with $component.subscription }}
            - name: ServiceBus__Subscription
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := $component.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $component.http }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if $.Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mobility-finance.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: {{ $name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mobility-finance.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: {{ $name }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
