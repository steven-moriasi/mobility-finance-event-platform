{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mobility-finance.fullname" . }}-default
  labels:
    {{- include "mobility-finance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mobility-finance.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: mobility-finance
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: mobility-finance
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mobility-finance.fullname" . }}-web-ingress
  labels:
    {{- include "mobility-finance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mobility-finance.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
